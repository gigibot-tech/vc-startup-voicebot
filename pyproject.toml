[project]
name = "startup-voice-agent"
version = "0.1.0"
description = "HTGF-style voice intake agent for structured startup first conversations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrea Rachetta" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "elevenlabs>=2.75.0",
    "fpdf2>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
livekit = [
    "livekit-agents>=1.5",
    "livekit-plugins-nvidia[personaplex]",
]

[project.scripts]
startup-voice = "startup_voice.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/startup_voice"]

[tool.hatch.build.targets.wheel.force-include]
"src/startup_voice/static" = "startup_voice/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
