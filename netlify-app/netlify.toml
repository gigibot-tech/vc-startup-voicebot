# Netlify site settings: Base directory = netlify-app   (Publish/Functions are relative to it)
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/board"
  to = "/static/features/board/board.html"
  status = 200

[[redirects]]
  from = "/d/*"
  to = "/static/features/board/dossier.html"
  status = 200

[dev]
  framework = "#static"
  publish = "dist"
  functions = "netlify/functions"
